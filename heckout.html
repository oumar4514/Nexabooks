<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaBooks | Panier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="logo">NexaBooks</div>
        <nav class="nav-links">
          <a href="index.html">Accueil</a>
          <a href="books.html">E-books</a>
          <a href="checkout.html">Panier</a>
          <a href="profile.html">Profil</a>
        </nav>
        <div class="nav-actions">
          <a class="cart-btn" href="checkout.html">🛒 <span id="cartCount">0</span></a>
          <a class="profile-btn" href="profile.html">Mon compte</a>
          <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="container checkout-page">
      <div class="checkout-layout">
        <section class="checkout-box">
          <h1>Votre panier</h1>
          <div id="cartItems" class="cart-list"></div>
        </section>

        <aside class="summary-box">
          <h2>Résumé</h2>
          <div class="summary-row"><span>Sous-total</span><strong id="subtotal">0 FCFA</strong></div>
          <div class="summary-row"><span>Frais</span><strong id="fees">0 FCFA</strong></div>
          <div class="summary-row total"><span>Total</span><strong id="total">0 FCFA</strong></div>
          <button id="payBtn" class="primary-btn full">Commander & payer</button>
        </aside>
      </div>
    </main>

    <div id="paymentModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Paiement</h3>
          <button id="closePayment" class="close-btn">×</button>
        </div>
        <p class="payment-note">Choisissez votre mode de paiement mobile disponible :</p>

        <div class="payment-options">
          <label><input type="radio" name="paymentMethod" value="orange-money" checked /> Orange Money</label>
          <label><input type="radio" name="paymentMethod" value="wave" /> Wave</label>
          <label><input type="radio" name="paymentMethod" value="moov" /> Moov Money</label>
        </div>

        <div class="field">
          <label for="paymentPhone">Numéro de paiement *</label>
          <input id="paymentPhone" type="tel" placeholder="+223 00 00 00 00" />
        </div>

        <button id="confirmPayment" class="primary-btn full">Valider le paiement</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
